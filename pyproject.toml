[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-auth"
version = "0.3.0"
description = "Managed access passwords and sessions for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.4.0"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-auth"
Repository = "https://github.com/toolframe/toolframe-auth"
Documentation = "https://github.com/toolframe/toolframe-auth#readme"
Issues = "https://github.com/toolframe/toolframe-auth/issues"

[project.entry-points."toolframe.plugins"]
auth = "toolframe_auth.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "toolframe-sql-sqlite==0.4.0"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-sql-sqlite = { path = "../toolframe-sql-sqlite", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
