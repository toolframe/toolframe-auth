name: Python CI

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-ref:
        description: Require this ref to match the package version before validation
        type: string
        default: ""
    secrets:
      TOOLFRAME_DEPENDENCIES_TOKEN:
        description: Optional read-only token for private sibling repositories
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the revision being validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: toolframe-auth
          persist-credentials: false

      - name: Check out the pinned SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}/toolframe-sdk
          ref: 833c415bd3a4f75613613d4f148d7a3a41a9528c
          path: toolframe-sdk
          token: ${{ secrets.TOOLFRAME_DEPENDENCIES_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out the pinned SQLite provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}/toolframe-storage-sqlite
          ref: a6c3148a5079f78c935b434a60f6cbb62489ded7
          path: toolframe-storage-sqlite
          token: ${{ secrets.TOOLFRAME_DEPENDENCIES_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Lint, test, build and install the distributions
        working-directory: toolframe-auth
        env:
          RELEASE_REF: ${{ inputs.release-ref || '' }}
        run: python scripts/ci.py --release-ref "$RELEASE_REF" --output "$RUNNER_TEMP/auth-dist"

      - name: Save validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolframe-auth-dist
          path: |
            ${{ runner.temp }}/auth-dist/*.whl
            ${{ runner.temp }}/auth-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
