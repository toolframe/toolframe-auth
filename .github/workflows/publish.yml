name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index (run this workflow on a v<project.version> tag)
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      release-ref: ${{ github.ref }}
    secrets:
      TOOLFRAME_DEPENDENCIES_TOKEN: ${{ secrets.TOOLFRAME_DEPENDENCIES_TOKEN }}

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - name: Download the distributions from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolframe-auth-dist
          path: dist

      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
