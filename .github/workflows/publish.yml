name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}-pypi
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      release-ref: ${{ github.ref }}

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  publish:
    needs: [validate, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distributions from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolframe-auth-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
